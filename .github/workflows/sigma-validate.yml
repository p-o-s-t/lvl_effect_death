name: Validate Sigma Rules

on: 
  push:
    branches-ignore: main 
    paths:
      - 'sigma/**.yml'
      - 'sigma/**.yaml'
  pull_request:
    branches: main 
    paths:
      - 'sigma/**.yml'
      - 'sigma/**yaml'
    workflow_dispatch:


jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo 
        uses: actions/checkout@v3

      - name: Install Sigma CLI and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip3 install sigma-cli

      - name: Validate rules 
        run: sigma check sigma 

      - name: Install Sigma CLI backends
        if: github.event_name == 'pull_request'
        run: sigma plugin install splunk sysmon windows

      - name: Test conversion
        if: github.event_name == 'pull_request'
        run: sigma convert -t splunk -f siem_rule_ndjson -p splunk_windows -o rules.ndjson sigma 

      - name: Test that post-process script runs w/o exceptions
        if: github.event_name == 'pull_request'
        run: python3 scripts/post-process.py 
