title: Use CertUtil to Decode Base64
id: af2639fa-c871-4e18-8241-47177fa346ff
status: experimental
description: |
    Detects usage of Certutil.exe to decode a Base64 encoded string.
    Written for CI/CD lesson in Level Effect DE&TH course. Convert to Splunk for this test.
author: p-o-s-t
date: 2026-03-23
modified: 2026-03-23
logsource:
    category: process
    product: windows
detection:
    selection:
      Image|endswith: 'certutil.exe'
      CommandLine|contains: 'decode '
    condition: selection
level: medium

